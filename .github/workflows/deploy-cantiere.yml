name: Deploy to Cantiere (Functions + Hosting)

on:
  workflow_dispatch:

jobs:
  deploy-cantiere:
    name: Deploy su Firebase Cantiere
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa Firebase CLI
        run: npm install -g firebase-tools

      - name: Installa dipendenze Python (functions)
        working-directory: AppLogSolutionsWeb/functions
        run: pip install -r requirements.txt

      - name: Deploy Hosting su Cantiere
        working-directory: AppLogSolutionsWeb
        run: firebase deploy --only hosting --project log-solutions-cantiere
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Functions su Cantiere
        working-directory: AppLogSolutionsWeb
        run: firebase deploy --only functions --project log-solutions-cantiere
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
